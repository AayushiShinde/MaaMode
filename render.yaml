# Render Blueprint for MaaMode
# Best Use of Render ( Track) - DEV Hacktoberfest 2026
services:
  - type: web
    name: maamode
    env: node
    plan: free
    region: oregon
    rootDir: MaaMode-Web
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELEVENLABS_API_KEY
        sync: false
